<script>

<script>
async function loadEvents(){
  const r = await call('listEvents'); if(!r.success) return toast(r.message);
  window.SCAN_URL = r.data.url; const t=$('events'); t.innerHTML='';
  $('noEv').classList.toggle('hide', r.data.events.length>0);
  r.data.events.filter(e=>(!$('evF').value||e.status===$('evF').value)&&e.name.toLowerCase().includes($('evQ').value.toLowerCase())).forEach(e=>{ const tr=document.createElement('tr');
    tr.innerHTML=`<td>${esc(e.name)}${e.status==='ARCHIVED'?' <span class="pill off">Archived</span>':''}</td><td>${esc(e.date)}</td><td><span class="pill ${e.published?'on':'off'}">${e.published?'Published':'Unpublished'}</span></td><td></td>`;
    const open=btn('Open',()=>openEvent(e)), tg=btn(e.published?'Unpublish':'Publish',async()=>{
      if(e.published && !confirm('Unpublish? All check-ins for this event will be blocked.')) return;
      const x=await call('setScannerPublished',e.id,!e.published); toast(x.success?'Scanner '+(e.published?'unpublished':'published'):x.message); loadEvents(); }),
      ed=btn('Edit',()=>editEvent(e)),dl=btn('Delete',()=>delEvent(e)),ar=btn(e.status==='ARCHIVED'?'Restore':'Archive',async()=>{ if(e.status!=='ARCHIVED' && !confirm('Archive event? Scanner will be unpublished.')) return; const x=await call('setEventStatus',e.id,e.status==='ARCHIVED'?'ACTIVE':'ARCHIVED'); toast(x.success?'Updated':x.message); loadEvents(); }),
      cp=btn('Copy link',()=>{ navigator.clipboard.writeText(r.data.url+'?page=scanner&event='+e.id); toast('Scanner link copied'); });
    tr.lastChild.append(open,' ',tg,' ',cp,' ',ar,' ',ed,' ',dl); t.append(tr); }); }
function btn(t,f){ const b=document.createElement('button'); b.className='sec'; b.textContent=t; b.onclick=f; return b; }
$('create').onclick = async () => { const n=$('newName').value.trim(); if(!n) return toast('Enter a name');
  $('create').disabled=true; pendingRq=pendingRq||('rq'+Date.now()+Math.random().toString(36).slice(2,8)); const x=await call('createEvent',n,$('newDate').value,$('newVenue').value,pendingRq); if(x.success) pendingRq=null;

<script>
function openEvent(e){ CUR=e; page=1; $('listView').classList.add('hide'); $('evView').classList.remove('hide'); $('evName').textContent=e.name; poll(); loadPeople();
  idle=0; lastChecked=null; sched(); }
/* Adaptive polling: 3s while attendance changes, backs off to 10s/30s when idle (protects the daily Apps Script runtime quota). */
let idle=0,lastChecked=null;
function sched(){ clearTimeout(timer); if(!CUR) return; const d=idle>20?30000:idle>5?10000:3000;
  timer=setTimeout(async()=>{ if(!document.hidden) await poll(); sched(); },d); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&CUR){ idle=0; poll(); sched(); } });
$('back').onclick=()=>{ clearTimeout(timer); CUR=null; $('evView').classList.add('hide'); $('listView').classList.remove('hide'); loadEvents(); };
async function poll(){ if(pollBusy||!CUR) return; pollBusy=true;           // no overlapping polls
  const r=await call('getEventSummary',CUR.id); pollBusy=false; if(!r.success||!CUR) return; const d=r.data; idle=(d.checked===lastChecked)?idle+1:0; lastChecked=d.checked;
  $('sT').textContent=d.total;$('sC').textContent=d.checked;$('sR').textContent=d.remaining;$('sP').textContent=d.pct+'%';
  $('recent').innerHTML=d.recent.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.time)}</td><td>${esc(x.staff)}</td></tr>`).join('')||'<tr><td>No check-ins yet</td></tr>'; }
async function loadPeople(){ const r=await call('getParticipants',CUR.id,page,$('q').value,$('st').value,$('qrF').value); if(!r.success) return toast(r.message);
  window.PEOPLE={}; r.data.rows.forEach(p=>PEOPLE[p.id]=p);
  $('ppl').innerHTML=r.data.rows.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td>${esc(p.phone)}</td><td>${p.qr}</td><td>${p.checked?'✔ Checked in':'Pending'}</td><td><button class="sec" data-a="ed" data-id="${esc(p.id)}">Edit</button> ${p.qr==='GENERATED'?`<button class="sec" data-a="qr" data-id="${esc(p.id)}" data-n="${esc(p.name)}">QR</button> <button class="sec" data-a="rg" data-id="${esc(p.id)}">Regenerate</button>`:''} ${p.checked?`<button class="sec" data-a="ud" data-id="${esc(p.id)}">Undo</button> <button class="sec" data-a="rc" data-id="${esc(p.id)}">Receipt</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6>No participants</td></tr>';
  $('pg').textContent=`Page ${r.data.page} · ${r.data.total} total`; $('prev').disabled=page<=1; $('next').disabled=page*r.data.size>=r.data.total; }
let deb; $('q').oninput=()=>{ clearTimeout(deb); deb=setTimeout(()=>{page=1;loadPeople();},350); }; $('st').onchange=$('qrF').onchange=()=>{page=1;loadPeople();};
$('prev').onclick=()=>{page--;loadPeople();}; $('next').onclick=()=>{page++;loadPeople();};
$('genQR').onclick=async()=>{ $('genQR').disabled=true; const r=await call('generateMissingQR',CUR.id); $('genQR').disabled=false;
  toast(r.success?`Generated ${r.data.generated}, skipped ${r.data.skipped}`:r.message); loadPeople(); };
$('impBtn').onclick=()=>$('imp').classList.toggle('hide');
$('loadH').onclick=async()=>{ const r=await call('getSourceHeaders',$('srcId').value.trim(),$('srcTab').value.trim()); if(!r.success) return toast(r.message);
  const f=['full_name','email','phone','organization','registration_number'];
  $('map').innerHTML=f.map(k=>`<div class="row"><label style="width:170px">${k}${k==='full_name'?' *':''}</label><select data-k="${k}"><option value="">— none —</option>${r.data.headers.map(h=>`<option>${esc(h)}</option>`).join('')}</select></div>`).join('')+'<button id="doImp">Import</button>';
  $('doImp').onclick=async()=>{ const m={}; document.querySelectorAll('#map select').forEach(s=>{ if(s.value) m[s.dataset.k]=s.value; });
    $('doImp').disabled=true; const x=await call('importParticipants',CUR.id,$('srcId').value.trim(),$('srcTab').value.trim()||r.data.sheets[0],m); $('doImp').disabled=false;
    toast(x.success?`Imported ${x.data.imported}, skipped ${x.data.skipped}, failed ${x.data.failed}`:x.message); loadPeople(); poll(); }; };

</script>
<script>
function saveBlob(blob,name){ const l=document.createElement('a'); l.href=URL.createObjectURL(blob); l.download=name; l.click(); setTimeout(()=>URL.revokeObjectURL(l.href),2000); }
const safeName = s => String(s).replace(/[^\w\-]+/g,'_').slice(0,60);
function qrDataUrl(text){ return new Promise(res=>{ const d=document.createElement('div'); new QRCode(d,{text,width:320,height:320,correctLevel:QRCode.CorrectLevel.M});
  setTimeout(()=>res(d.querySelector('canvas').toDataURL('image/png')),60); }); }
$('ppl').onclick = async ev => { const b=ev.target.closest('button[data-a]'); if(!b) return; const id=b.dataset.id; b.disabled=true;
  if(b.dataset.a==='qr'){ const r=await call('getQRTokens',CUR.id,id); if(r.success&&r.data[0]){ saveBlob(await (await fetch(await qrDataUrl(r.data[0].token))).blob(), safeName(b.dataset.n)+'-'+id+'.png'); } else toast(r.message||'No QR'); }
  if(b.dataset.a==='ed'){ const p=PEOPLE[id]; const n=prompt('Full name',p.name); if(n){ const r=await call('updateParticipant',CUR.id,id,{name:n,email:prompt('Email',p.email)||'',phone:prompt('Phone',p.phone)||'',org:prompt('Organization',p.org)||''}); toast(r.success?'Participant updated':r.message); loadPeople(); } }
  if(b.dataset.a==='rg'){ if(confirm('Regenerate? The old QR stops working immediately.')){ const r=await call('regenerateQR',CUR.id,id); toast(r.success?'New QR token issued':r.message); } }
  if(b.dataset.a==='ud'){ if(confirm('Undo this check-in? The participant can be scanned again.')){ const r=await call('undoCheckIn',CUR.id,id); toast(r.success?'Check-in removed':r.message); loadPeople(); poll(); } }
  if(b.dataset.a==='rc'){ const force=!confirm('OK = open the existing receipt.\nCancel = re-issue it with the current branding.'); const r=await call('generateReceipt',CUR.id,id,force); if(r.success&&r.data.url) window.open(r.data.url,'_blank'); else toast(r.success?'Receipt '+r.data.receipt_id:r.message); }
  b.disabled=false; };
$('zipQR').onclick = async () => { const bt=$('zipQR'); bt.disabled=true; const r=await call('getQRTokens',CUR.id); if(!r.success||!r.data.length){ bt.disabled=false; return toast(r.message||'Generate QR tokens first'); }

  saveBlob(await zip.generateAsync({type:'blob'}),'qr-codes-'+CUR.id+'.zip'); bt.textContent='Download all QR (ZIP)'; bt.disabled=false; };

<script>
function dlg(html){ $('dlgBody').innerHTML=html; if(!$('dlg').open) $('dlg').showModal(); }
$('dlgClose').onclick=()=>$('dlg').close();
async function accessDlg(result){
  const [kr,er]=await Promise.all([call('listScannerKeys'),call('listEvents')]);
  if(!kr.success||!er.success) return toast(!kr.success?kr.message:er.message);
  const edit=result&&result.editKey, active=er.data.events;

  const rows=kr.data.map(k=>{
    const assigned=k.events==='*'?'All events':k.events.split(',').map(id=>`${events.get(id)||'Unavailable'} (${id})`).map(esc).join(', ');

    return `<tr><td>${esc(k.label)}<br><small>${esc(k.id)}</small></td><td>${assigned}</td><td>${esc(k.status)}</td><td>${esc(k.expires||'Never')}</td><td>${actions}</td></tr>`;
  }).join('')||'<tr><td colspan="5">No scanner keys have been created.</td></tr>';
  dlg(`<h3>Access management</h3>
    <h4>${edit?'Edit scanner access':'Scanner access keys'}</h4><p>Each PIN is shown only when created or rotated. Assign only the events this scanner needs.</p>
    <form id="keyForm" ${edit?`data-edit-id="${esc(edit.id)}"`:''}><div class="row"><label for="keyLabel">Label</label><input id="keyLabel" value="${esc(edit?edit.label:'')}" required maxlength="80" placeholder="e.g. Main entrance"></div>
    <div class="row"><label for="keyEvents">Allowed events</label><select id="keyEvents" multiple size="4" required>${options}</select></div>
    <div class="row"><label for="keyExpiry">Expires on (optional)</label><input id="keyExpiry" type="date" value="${esc(edit?edit.expires:'')}"></div><button id="keyCreate" type="submit">${edit?'Save access changes':'Generate scanner PIN'}</button> ${edit?'<button class="sec" id="cancelKeyEdit" type="button">Cancel edit</button>':''}</form>
    <div id="keyResult" aria-live="polite"></div>
    <div style="max-height:35vh;overflow:auto"><table><thead><tr><th>Key</th><th>Events</th><th>Status</th><th>Expires</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
    <hr><h4>Change admin password</h4><form id="adminPasswordChange">

    <div class="row"><input id="newAdminPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="256" placeholder="New password (12+ characters)"></div>

    <button type="submit">Change password</button></form>`);
  if(result&&result.pin) $('keyResult').innerHTML=`<p><b>${esc(result.label||'Scanner key')} — copy this PIN now; it cannot be viewed again.</b></p><div class="row"><input id="generatedPin" readonly value="${esc(result.pin)}" aria-label="New scanner PIN"><button class="sec" id="copyPin" type="button">Copy PIN</button></div>`;
  $('dlgBody').onsubmit=async ev=>{
    ev.preventDefault();

      const selected=Array.from($('keyEvents').selectedOptions).map(o=>o.value);
      if(selected.includes('*')&&selected.length!==1) return toast('Choose all events or specific events, not both');
      $('keyCreate').disabled=true;

    }else if(ev.target.id==='adminPasswordChange'){
      const current=$('currentAdminPassword').value, next=$('newAdminPassword').value;
      if(next!==$('confirmAdminPassword').value) return toast('New passwords do not match');
      const r=await call('changeAdminPassword',current,next);
      if(!r.success) return toast(r.message);
      $('dlg').close(); $('dlgBody').innerHTML=''; signedOut(); toast('Admin password changed. Sign in with the new password.');
    }
  };
}
$('dlgBody').onclick=async ev=>{ const b=ev.target.closest('button'); if(!b) return;
  if(b.id==='copyPin'){
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText($('generatedPin').value).then(()=>toast('PIN copied')).catch(()=>toast('Copy failed; select and copy the PIN manually'));
    else { $('generatedPin').select(); toast(document.execCommand('copy')?'PIN copied':'Select and copy the PIN manually'); }
  }
  if(b.id==='cancelKeyEdit'){ accessDlg(); }
  if(b.dataset.keyAction==='edit'){
    const kr=await call('listScannerKeys'); if(!kr.success) return toast(kr.message);
    const key=kr.data.find(x=>x.id===b.dataset.id); if(key) accessDlg({editKey:key});
  }
  if(b.dataset.keyAction==='revoke'){
    if(!confirm('Revoke this scanner PIN? Existing scanner sessions will stop working.')) return;
    const r=await call('revokeScannerKey',b.dataset.id); if(!r.success) return toast(r.message);
    toast('Scanner PIN revoked'); accessDlg();
  }
  if(b.dataset.keyAction==='rotate'){
    if(!confirm('Rotate this PIN? The old PIN and its active sessions will stop working.')) return;
    const r=await call('rotateScannerKey',b.dataset.id); if(!r.success) return toast(r.message);
    accessDlg({label:'Rotated scanner key',pin:r.data.pin});
  }
  if(b.id==='logoUp'){ const f=$('logoFile').files[0]; if(!f) return toast('Choose an image first'); try{ const png=await fileToPng(f,400); const r=await call('uploadLogo',png); toast(r.success?'Logo uploaded':r.message); if(r.success) $('navSet').onclick(); }catch(err){ toast('Could not read image'); } }
  if(b.id==='logoRm'){ const r=await call('removeLogo'); toast(r.success?'Logo removed':r.message); $('navSet').onclick(); }
  if(b.id==='setSave'){ const r=await call('saveSettings',{name:$('sN').value,tagline:$('sT2').value,address:$('sA').value,timezone:$('sZ').value,color:$('sC').value,footer:$('sF').value}); toast(r.success?'Saved':r.message); } };
function fileToPng(file,max){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/png').split(',')[1]); }; img.onerror=rej; img.src=URL.createObjectURL(file); }); }
$('navAccess').onclick=()=>accessDlg();
$('navSet').onclick=async()=>{ const r=await call('getSettings'); if(!r.success) return toast(r.message); const s=r.data;
  dlg(`<h3>Settings</h3><div class="row"><input id="sN" placeholder="Organization name" value="${esc(s.name)}"></div><div class="row"><input id="sT2" placeholder="Tagline" value="${esc(s.tagline)}"></div><div class="row"><input id="sA" placeholder="Address" value="${esc(s.address)}"></div><div class="row"><input id="sZ" placeholder="Timezone e.g. Asia/Kathmandu" value="${esc(s.timezone)}"></div><div class="row"><label>Header color <input id="sC" type="color" value="${esc(s.color)}"></label></div><div class="row"><input id="sF" placeholder="PDF footer text" size="50" value="${esc(s.footer)}"></div><div class="row"><b>Logo</b> ${s.logo?`<img src="${s.logo}" style="max-height:48px">`:'<small>none</small>'} <input id="logoFile" type="file" accept="image/*"><button class="sec" id="logoUp">Upload</button>${s.logo?'<button class="sec" id="logoRm">Remove</button>':''}</div><button id="setSave">Save</button> <small>Used on receipts and all displayed times.</small>`); };
$('navAudit').onclick=async()=>{ const r=await call('getAuditLog',100); if(!r.success) return toast(r.message);
  dlg('<h3>Audit log</h3><div style="max-height:60vh;overflow:auto"><table>'+(r.data.map(x=>`<tr><td>${esc(x.time)}</td><td>${esc(x.action)}</td><td>${esc(x.user)}</td><td>${esc(x.event)}</td><td>${esc(x.details)}</td></tr>`).join('')||'<tr><td>No entries</td></tr>')+'</table></div>'); };
let charts=[];
$('rep').onclick=async()=>{ const r=await call('getReport',CUR.id); if(!r.success) return toast(r.message); const d=r.data;
  dlg(`<h3>${esc(CUR.name)} - report</h3><p>${d.checked} of ${d.total} checked in (${d.total?Math.round(d.checked*100/d.total):0}%)</p><canvas id="c1" height="140"></canvas><h4>By staff member</h4><canvas id="c2" height="100"></canvas>`);
  charts.forEach(c=>c.destroy()); charts=[
   new Chart($('c1'),{type:'bar',data:{labels:d.labels,datasets:[{label:'Check-ins per 15 min',data:d.counts,backgroundColor:'#0f1b3d'}]}}),
   new Chart($('c2'),{type:'bar',data:{labels:d.staffNames,datasets:[{label:'Check-ins',data:d.staffCounts,backgroundColor:'#14702f'}]},options:{indexAxis:'y'}})]; };
$('walk').onclick=async()=>{ const n=prompt('Walk-in full name'); if(!n) return; const r=await call('addWalkIn',CUR.id,n,prompt('Email (optional)')||'',prompt('Phone (optional)')||'',''); toast(r.success?'Walk-in checked in':r.message); loadPeople(); poll(); };

$('saveQR').onclick = async () => { const bt=$('saveQR'); bt.disabled=true; let saved=0, failed=false;
  for(;;){ const r=await call('getQRPending',CUR.id,25); if(!r.success){ toast(r.message); failed=true; break; }
    if(!r.data.items.length) break;
    const items=[]; for(const it of r.data.items){ items.push({id:it.id,png:(await qrDataUrl(it.token)).split(',')[1]}); }
    const s=await call('saveQRImages',CUR.id,items); if(!s.success||!s.data.saved){ toast(s.message||'Save stopped'); failed=true; break; }
    saved+=s.data.saved; bt.textContent=`Images saved ${saved}, ${r.data.remaining-s.data.saved} left`; }
  if(!failed){ let off=0; for(;;){ const d=await call('buildQRDoc',CUR.id,off); if(!d.success){ toast(d.message); failed=true; break; }
      bt.textContent=`Building Doc ${Math.min(d.data.next,d.data.total)}/${d.data.total}`; if(d.data.done){ toast('QR Doc ready'); window.open(d.data.url,'_blank'); break; } off=d.data.next; } }
  bt.textContent='Save QR to Drive + build Doc'; bt.disabled=false; };
$('openDoc').onclick = async () => { const r=await call('getQRDocInfo',CUR.id); if(r.success&&r.data.url) window.open(r.data.url,'_blank'); else toast(r.message||'No QR Doc yet - click Save QR to Drive'); };

</script>
<script>
let dashBusy=false;
async function loadDash(){ if(document.hidden||CUR||!SID||dashBusy) return; dashBusy=true; const r=await call('getDashboardSummary'); dashBusy=false; if(!r.success) return; const d=r.data;
  $('dE').textContent=d.events;$('dA').textContent=d.active;$('dS').textContent=d.published;$('dP').textContent=d.participants;$('dC').textContent=d.checked; }
setInterval(loadDash,5000);
let evDeb; $('evQ').oninput=()=>{ clearTimeout(evDeb); evDeb=setTimeout(loadEvents,300); }; $('evF').onchange=loadEvents;
async function editEvent(e){ const n=prompt('Event name',e.name); if(!n) return; const r=await call('updateEvent',e.id,{name:n,date:prompt('Date (YYYY-MM-DD)',e.date)||'',venue:prompt('Venue',e.venue)||'',description:prompt('Description',e.description)||'',start:prompt('Start time (HH:MM)',e.start)||'',end:prompt('End time (HH:MM)',e.end)||''});
  toast(r.success?'Event updated':r.message); loadEvents(); }
async function delEvent(e){ const t=prompt('This hides the event and closes its scanner. Data is kept in Drive/Sheets.\nType the exact event name to confirm:'); if(t===null) return;
  const r=await call('deleteEvent',e.id,t); toast(r.success?'Event deleted (data kept)':r.message); loadEvents(); }
$('conn').onclick=async()=>{ const id=prompt('Existing spreadsheet ID (it must be shared with the owner account):'); if(!id) return; const r=await call('connectExistingSpreadsheet',CUR.id,id.trim()); toast(r.success?'Connected: '+r.data.name:r.message); poll(); loadPeople(); };
$('csvP').onclick=()=>csv('participants');
let AO={page:1};
async function attLoad(){ AO.q=$('aq').value; AO.staff=$('as').value; AO.from=$('af').value; AO.to=$('at').value;
  const r=await call('getAttendance',CUR.id,AO.page,AO); if(!r.success) return toast(r.message); const d=r.data;
  if($('as').options.length<2) d.staff.forEach(s=>$('as').add(new Option(s,s)));
  $('arows').innerHTML=d.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.time)}</td><td>${esc(x.staff)}</td><td>${x.url?`<a href="${esc(x.url)}" target="_blank">${esc(x.receipt)}</a>`:esc(x.receipt)}</td></tr>`).join('')||'<tr><td colspan=5>No attendance</td></tr>';
  $('apg').textContent=`Page ${d.page} · ${d.total} records`; $('aprev').disabled=AO.page<=1; $('anext').disabled=AO.page*d.size>=d.total; }
$('att').onclick=()=>{ AO={page:1}; dlg('<h3>Attendance</h3><div class="row"><input id="aq" placeholder="Search"><select id="as"><option value="">All staff</option></select><input id="af" type="date"><input id="at" type="date"><button id="ago">Apply</button></div><div style="max-height:50vh;overflow:auto"><table><thead><tr><th>Name</th><th>Phone</th><th>Time</th><th>Staff</th><th>Receipt</th></tr></thead><tbody id="arows"></tbody></table></div><div class="row"><button class="sec" id="aprev">Prev</button><span id="apg"></span><button class="sec" id="anext">Next</button></div>');
  $('ago').onclick=()=>{AO.page=1;attLoad();}; $('aprev').onclick=()=>{AO.page--;attLoad();}; $('anext').onclick=()=>{AO.page++;attLoad();}; attLoad(); };
$('pdfRep').onclick=async()=>{ const bt=$('pdfRep'); bt.disabled=true; const r=await call('generateAttendancePDF',CUR.id,{from:(AO.from||''),to:(AO.to||''),staff:(AO.staff||''),q:(AO.q||'')}); bt.disabled=false;
  if(r.success){ toast('PDF saved ('+r.data.rows+' rows)'); window.open(r.data.url,'_blank'); } else toast(r.message); };

</script>
</body></html>
